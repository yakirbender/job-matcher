# Skills the keyword scorer recognizes in both your CV and job postings.
#
# Each entry is a canonical name and its other spellings (English and French). Matching
# ignores case and accents and works on whole words, so "c#" won't match "c" and "java"
# won't match "javascript". Add anything your CV or target jobs use.

# Names that are too ambiguous to match bare in job text ("C-level", "R&D", "go to
# market"). Bare, they only count in your CV, where they appear in a skills list;
# in postings they need one of their longer spellings ("C/C++", "golang").
cv_only_bare_names: [c, r, go]

# Half credit: a job skill you don't have, but a close relative you do. "angular:
# [react, vue]" means knowing React or Vue counts half toward an Angular requirement.
related_skills:
  angular: [react, vue]
  react: [vue, angular]
  vue: [react, angular]
  typescript: [javascript]
  javascript: [typescript]
  node.js: [javascript]
  express: [node.js]
  kotlin: [java]
  c#: [java, c++]
  .net: [c#]
  c++: [c]
  c: [c++]
  django: [python]
  flask: [python, django]
  fastapi: [python, flask]
  mysql: [postgresql, sqlite, sql]
  postgresql: [mysql, sqlite, sql]
  sqlite: [postgresql, mysql, sql]
  oracle: [sql]
  aws: [azure, gcp]
  azure: [aws, gcp]
  gcp: [azure, aws]
  kubernetes: [docker]
  test automation: [unit testing, bdd]

