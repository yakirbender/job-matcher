[project]
name = "job-matcher"
version = "0.1.0"
description = "Fetch bilingual software job postings, filter them against a profile, and score them against a CV."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pdfplumber>=0.11.10",
    "pydantic>=2.9",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.scripts]
jm = "job_matcher.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_matcher"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
